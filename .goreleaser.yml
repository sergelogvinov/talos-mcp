# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: talos-mcp

dist: bin
builds:
  - id: default
    main: ./cmd/talos-mcp
    binary: talos-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    goarm64:
      - v8.0
    hooks:
      post: make release-mcpb OS={{ .Os }} ARCH={{ .Arch }} VERSION={{ .Version }} BUNDLE_DIR={{ dir .Path }}/bundle

snapshot:
  version_template: edge

changelog:
  disable: true

archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

homebrew_casks:
  - name: talos-mcp
    description: Talos MCP is an opinionated MCP server for Talos Linux
    homepage: "https://github.com/sergelogvinov/{{ .ProjectName }}"
    license: Apache-2.0

    directory: Casks
    commit_author:
      name: sergelogvinov
      email: 5407715+sergelogvinov@users.noreply.github.com
    repository:
      owner: sergelogvinov
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TOKEN }}"

    # Bug in goreleaser v2.17.1?: target is bin/talos-mcp,
    # but it should be talos-mcp, so we need to override it in custom_block
    custom_block: |
      arch arm: "arm64", intel: "amd64"

    # Bug?
    # need set full name of binary in postflight - talos-mcp_darwin_#{arch}
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/talos-mcp_darwin_#{arch}"]
          end

dockers_v2:
  - id: docker
    flags:
      - --target=gorelease
    images:
      - "ghcr.io/sergelogvinov/{{ .ProjectName }}"
    tags:
      - "{{ if not .IsSnapshot }}v{{.Version}}{{ else }}edge{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      io.modelcontextprotocol.server.name: "io.github.sergelogvinov/{{ .ProjectName }}"
    annotations:
      org.opencontainers.image.name: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Talos MCP is an opinionated MCP server for Talos Linux"
      org.opencontainers.image.licenses: "Apache-2.0"
      org.opencontainers.image.source: "https://github.com/sergelogvinov/{{ .ProjectName }}"
      org.opencontainers.image.url: "{{ .GitURL }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      io.artifacthub.package.readme-url: "https://raw.githubusercontent.com/sergelogvinov/{{ .ProjectName }}/main/README.md"
      io.artifacthub.package.license: "Apache-2.0"

docker_digest:
  name_template: "digest.txt"

docker_signs:
  - id: docker
    cmd: cosign
    args:
      - sign
      - "--yes"
      - "${artifact}"
    output: true

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: ./talos-mcp_*.mcpb

signs:
  - artifacts: checksum
    signature: "${artifact}.sigstore.json"
    cmd: cosign
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    output: true

publishers:
  - name: mcpb
    ids:
      - default
    cmd: gh release upload {{ .Tag }} {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}.mcpb --clobber
    env:
      - GH_TOKEN={{ .Env.GITHUB_TOKEN }}

mcp:
  name: io.github.sergelogvinov/{{ .ProjectName }}
  title: "Talos MCP server for Talos Linux"
  description: "Talos MCP is an opinionated MCP server for Talos Linux"
  homepage: "https://github.com/sergelogvinov/{{ .ProjectName }}"
  auth:
    type: github-oidc
    token: "{{ .Env.GITHUB_TOKEN }}"
  repository:
    url: "https://github.com/sergelogvinov/{{ .ProjectName }}"
    source: github
    id: "1399547094"
  transports:
    - type: stdio
    - type: streamable-http
  # https://github.com/goreleaser/goreleaser/discussions/6251
  packages:
    - registry_type: oci
      identifier: "ghcr.io/sergelogvinov/{{ .ProjectName }}:v{{ .Version }}"
      transport:
        type: stdio
